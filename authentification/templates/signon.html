<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-100 min-h-screen flex items-center justify-center font-sans">

  {% block content %}
  <div class="w-full max-w-5xl bg-white rounded-3xl shadow-xl flex overflow-hidden">

    <!-- Colonne gauche : Logo + Titre -->
    <div class="w-1/2 bg-pink-100 p-10 flex flex-col items-center justify-center">
      {% load static %}
      <img src="{% static 'authentification/images/my_logo.png' %}" alt="Crumble Kiss Logo" class="logo">
      <h2 class="text-3xl font-bold text-pink-800 mt-4">Login</h2>
    </div>

    <!-- Colonne droite : Formulaire -->
    <div class="w-1/2 p-10">
      {% if message %}
        <div class="mb-4 p-4 bg-red-100 text-red-700 rounded-md text-sm">
          {{ message }}
        </div>
      {% endif %}

      <form method="post" class="grid grid-cols-1 gap-4">
        {% csrf_token %}

        <!-- Champ Username -->
        <div>
          <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
            Username
          </label>
          {{ form.username }}
        </div>

        <!-- Champ Password -->
        <div>
          <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
            Password
          </label>
          {{ form.password }}
        </div>

        <!-- Bouton -->
        <div class="mt-2">
          <button type="submit" class="w-full bg-pink-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-pink-700 transition">
            Se connecter
          </button>
        </div>

        <!-- Lien vers l'inscription -->
        <div class="text-center text-sm text-gray-600 mt-2">
          Don't have an account?
          <a href="{% url 'signup' %}" class="text-pink-600 hover:underline">Sign up ></a>
        </div>
      </form>
    </div>
  </div>
  {% endblock content %}

  <!-- Style des inputs (comme dans l’inscription) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const fields = document.querySelectorAll("input, select, textarea");
      fields.forEach(el => {
        el.classList.add(
          "w-full", "px-4", "py-2", "border", "rounded-lg",
          "focus:outline-none", "focus:ring-2", "focus:ring-pink-400"
        );
      });
    });
  </script>

</body>
</html>
