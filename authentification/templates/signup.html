<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-100 min-h-screen flex items-center justify-center font-sans">

  {% block content %}
  <div class="w-full max-w-5xl bg-white rounded-3xl shadow-xl flex overflow-hidden">
    
    <!-- Colonne gauche : Logo + Titre -->
    <div class="w-1/2 bg-pink-100 p-10 flex flex-col items-center justify-center">
    {% load static %}

    <img src="{% static 'authentification/images/my_logo.png' %}" alt="Crumble Kiss Logo" class="logo">
      <h2 class="text-3xl font-bold text-pink-800">Sign up</h2>
    </div>

    <!-- Colonne droite : Formulaire -->
    <div class="w-1/2 p-10">
      {% if form.errors %}
        <div class="mb-4 p-4 bg-red-100 text-red-700 rounded-md text-sm">
          {{ form.errors }}
        </div>
      {% endif %}

      <form method="post" class="grid grid-cols-2 gap-4">
        {% csrf_token %}

        {% for field in form %}
          <div class="col-span-1">
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
              {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
              <p class="text-sm text-red-600 mt-1">{{ field.errors|striptags }}</p>
            {% endif %}
          </div>
        {% endfor %}

        <!-- Bouton "Register" sur deux colonnes -->
        <div class="col-span-2 mt-4">
          <button type="submit" class="w-full bg-pink-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-pink-700 transition">
            Register
          </button>
        </div>

        <!-- Lien de connexion -->
        <div class="col-span-2 text-center text-sm text-gray-600 mt-2">
          <a href="{% url 'signon' %}" class="text-pink-600 hover:underline">
            Already have an account? Log in
          </a>
        </div>
      </form>
    </div>
  </div>
  {% endblock content %}

  <!-- Style des inputs -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const fields = document.querySelectorAll("input, select, textarea");
      fields.forEach(el => {
        el.classList.add(
          "w-full", "px-4", "py-2", "border", "rounded-lg",
          "focus:outline-none", "focus:ring-2", "focus:ring-pink-400"
        );
      });
    });
  </script>

</body>
</html>
