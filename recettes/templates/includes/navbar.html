{% load static %}
<header class="sticky top-0 z-50 bg-cream/80 backdrop-blur-md border-b border-rose-100">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      <!-- Logo -->
      <a href="{% url 'home_page' %}" class="flex items-center gap-3 group">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-rose-400 to-rose-600 flex items-center justify-center shadow-md group-hover:shadow-lg transition-shadow">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4c1.74 0 3.41 1.1 4.13 2.59h.75C13.09 5.1 14.76 4 16.5 4 19 4 21 6 21 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <span class="font-display text-2xl font-600 text-chocolate-600 tracking-tight">Crumble Kiss</span>
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center gap-1">
        <a href="{% url 'home_page' %}" class="px-4 py-2 text-sm font-500 text-chocolate-500 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-all">All Recipes</a>
        <a href="{% url 'create_recipes' %}" class="px-4 py-2 text-sm font-500 text-chocolate-500 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-all">Add a Recipe</a>
        <a href="{% url 'my_recipes' %}" class="px-4 py-2 text-sm font-500 text-chocolate-500 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-all">My Recipes</a>
      </div>

      <!-- User menu -->
      <div class="flex items-center gap-3">
        <div class="relative">
          <button id="user-menu-button" class="flex items-center gap-2 p-1.5 pr-3 rounded-full hover:bg-rose-50 transition-colors" aria-expanded="false">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-chocolate-300 to-chocolate-500 flex items-center justify-center text-white text-sm font-600">
              {{ user.username|first|upper }}
            </div>
            <span class="hidden sm:block text-sm font-500 text-chocolate-600">{{ user.username }}</span>
            <svg class="w-4 h-4 text-chocolate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div id="user-dropdown" class="hidden absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-xl ring-1 ring-rose-100 py-2 overflow-hidden">
            <div class="px-4 py-3 border-b border-rose-50">
              <p class="text-sm font-600 text-chocolate-600">{{ user.username }}</p>
              <p class="text-xs text-chocolate-300">{{ user.email }}</p>
            </div>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm text-chocolate-500 hover:bg-rose-50 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              Your Profile
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm text-chocolate-500 hover:bg-rose-50 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              Settings
            </a>
            <a href="{% url 'logout' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-rose-600 hover:bg-rose-50 transition-colors border-t border-rose-50 mt-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
              Sign out
            </a>
          </div>
        </div>

        <!-- Mobile toggle -->
        <button id="menu-btn" class="md:hidden p-2 text-chocolate-500 rounded-lg hover:bg-rose-50 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden pb-4 space-y-1">
      <a href="{% url 'home_page' %}" class="block px-4 py-2.5 text-sm font-500 text-chocolate-500 hover:bg-rose-50 rounded-lg transition-colors">All Recipes</a>
      <a href="{% url 'create_recipes' %}" class="block px-4 py-2.5 text-sm font-500 text-chocolate-500 hover:bg-rose-50 rounded-lg transition-colors">Add a Recipe</a>
      <a href="{% url 'my_recipes' %}" class="block px-4 py-2.5 text-sm font-500 text-chocolate-500 hover:bg-rose-50 rounded-lg transition-colors">My Recipes</a>
    </div>
  </nav>
</header>

<script>
  document.getElementById('menu-btn')?.addEventListener('click', () => {
    document.getElementById('mobile-menu').classList.toggle('hidden');
  });
  const userBtn = document.getElementById('user-menu-button');
  const dropdown = document.getElementById('user-dropdown');
  userBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('hidden');
  });
  document.addEventListener('click', (e) => {
    if (!userBtn?.contains(e.target) && !dropdown?.contains(e.target)) {
      dropdown?.classList.add('hidden');
    }
  });
</script>
