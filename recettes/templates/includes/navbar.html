<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navbg: '#fde2e6',
          accent: '#ec4899',
          chocolate: '#4b2f2f'
        }
      }
    }
  }
</script>

{% load static %}

<nav class="bg-navbg border-b border-pink-200 shadow-sm">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      <!-- Logo & Brand -->
      <div class="flex items-center space-x-4">
        <img src="{% static 'recettes/images/my_logo.png' %}" alt="Logo" class="w-12 h-12">
        <span class="text-2xl font-bold text-accent">Crumble Kiss</span>
      </div>
      <!-- Liens -->
      <div class="hidden md:flex space-x-8 text-sm font-medium text-chocolate">
        <a href="{% url 'home_page' %}" class="hover:text-accent">All Recipes</a>
        <a href="{% url 'create_recipes' %}" class="hover:text-accent">Add a Recipe</a>
        <a href="{% url 'my_recipes' %}" class="hover:text-accent">My recipes</a>

      </div>
      <!-- Utilisateur -->
      <div class="relative ml-3">
          <div>
            <button type="button" class="relative flex rounded-full bg-gray-800 text-sm focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800 focus:outline-hidden" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
              <span class="absolute -inset-1.5"></span>
              <span class="sr-only">Open user menu</span>
              <img class="size-8 rounded-full" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="">
            </button>
          </div>
          <div class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white py-1 shadow-lg ring-1 ring-black/5 focus:outline-hidden" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
            <!-- Active: "bg-gray-100 outline-hidden", Not Active: "" -->
            <a href="#" class="block px-4 py-2 text-sm text-gray-700" role="menuitem" tabindex="-1" id="user-menu-item-0">Your Profile</a>
            <a href="#" class="block px-4 py-2 text-sm text-gray-700" role="menuitem" tabindex="-1" id="user-menu-item-1">Settings</a>
            <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm text-gray-700" role="menuitem" tabindex="-1" id="user-menu-item-2">Sign out</a>
          </div>
        </div>
      <!-- Toggle mobile -->
      <button id="menu-btn" class="md:hidden text-chocolate focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
             d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
  <!-- Menu mobile -->
  <div id="menu" class="hidden md:hidden bg-navbg px-4 pb-4 space-y-2">
    <a href="{% url 'home_page' %}" class="block text-chocolate hover:text-accent">All Recipes</a>
    <a href="{% url 'create_recipes' %}" class="block text-chocolate hover:text-accent">Add a Recipe</a>
  </div>
  <script>
    document.getElementById('menu-btn').addEventListener('click', () => {
      document.getElementById('menu').classList.toggle('hidden');
    });
  </script>
</nav>
